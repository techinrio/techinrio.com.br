<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Tech In Rio — Open Graph</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --orange: #fa7f01;
        --black: #0b0b0b;
        --gray-800: #1f1f1f;
        --gray-400: #888888;
        --gray-200: #cccccc;
        --white: #f5f5f5;
        --font-body: Inter, system-ui, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--black);
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        background: var(--black);
        color: var(--white);
        font-family: var(--font-body);
        overflow: hidden;
      }

      .glow {
        position: absolute;
        pointer-events: none;
      }

      .glow-a {
        width: 720px;
        height: 520px;
        right: -80px;
        top: -120px;
        background: radial-gradient(ellipse at center, rgba(250, 127, 1, 0.22) 0%, transparent 68%);
      }

      .glow-b {
        width: 480px;
        height: 360px;
        left: -80px;
        bottom: -80px;
        background: radial-gradient(ellipse at center, rgba(250, 127, 1, 0.08) 0%, transparent 70%);
      }

      .symbol-wrap {
        position: absolute;
        right: 56px;
        top: 50%;
        translate: 0 -50%;
        width: 430px;
        height: 430px;
      }

      .symbol-wrap img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        filter: drop-shadow(0 24px 60px rgba(250, 127, 1, 0.28));
      }

      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 720px;
        height: 100%;
        padding: 56px 40px 52px 72px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand img {
        width: 44px;
        height: 44px;
        display: block;
      }

      .brand-name {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--white);
        line-height: 1;
      }

      .brand-name span {
        color: var(--orange);
      }

      .copy {
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      .label {
        font-family: var(--font-mono);
        font-size: 16px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--orange);
      }

      h1 {
        font-size: 64px;
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.03em;
      }

      h1 em {
        color: var(--orange);
        font-style: normal;
      }

      .desc {
        font-size: 24px;
        line-height: 1.4;
        color: var(--gray-200);
        max-width: 540px;
        font-weight: 500;
      }

      .footer {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .cta {
        display: inline-flex;
        align-items: center;
        background: var(--orange);
        color: var(--black);
        font-size: 22px;
        font-weight: 600;
        padding: 16px 28px;
        border-radius: 8px;
        line-height: 1;
      }

      .url {
        font-family: var(--font-mono);
        font-size: 16px;
        color: var(--gray-400);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="glow glow-a"></div>
      <div class="glow glow-b"></div>
      <div class="symbol-wrap">
        <img src="/img/symbol-orange.png" alt="" />
      </div>
      <div class="content">
        <div class="brand">
          <img src="/img/symbol-orange.png" alt="" />
          <p class="brand-name">Tech<span>In</span>Rio</p>
        </div>
        <div class="copy">
          <p class="label">// comunidade</p>
          <h1>Tecnologia com<br /><em>a alma do Rio</em></h1>
          <p class="desc">A comunidade de tecnologia mais carioca de todo Brasil.</p>
        </div>
        <div class="footer">
          <span class="cta">Chega junto</span>
          <span class="url">techinrio.com.br</span>
        </div>
      </div>
    </div>
  </body>
</html>
