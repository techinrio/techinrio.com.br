name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Cadastro de membro: quem não é da organização só altera o próprio perfil.
      # Regras em scripts/check-member-pr.sh; a aprovação de mantenedor segue
      # obrigatória via CODEOWNERS.
      - name: Check member file authorship
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ASSOC: ${{ github.event.pull_request.author_association }}
        run: bash scripts/check-member-pr.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      # O build valida os dados da comunidade (schema + regras em src/lib/comunidade.ts).
      - run: yarn build
